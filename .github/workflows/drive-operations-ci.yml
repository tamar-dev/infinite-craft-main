name: Drive operations CI
on:
  push:
    branches: [feature/drive-actions]
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'supabase/drive-operations.sql'
      - '.github/workflows/drive-operations-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/_shared/proxy/
      - run: deno check supabase/functions/drive-operation/index.ts supabase/functions/drive-copy/index.ts supabase/functions/drive-download/index.ts supabase/functions/drive-trash/index.ts
